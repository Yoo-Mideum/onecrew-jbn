<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>원크루 자료실 · 정복녀 대표님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#2b2622;--sub:#7a7068;--line:#e6dfd5;
  --accent:#2f6f5e;--accent-soft:#e3efe9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#181614;--card:#24211e;--ink:#f1ece5;--sub:#a79d93;--line:#3a3530;
    --accent:#7cc4ad;--accent-soft:#23332e;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:18px;line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
header{padding:52px 0 30px}
.tag{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:.06em}
h1{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-weight:400;font-size:34px;line-height:1.3;margin:10px 0 10px}
header p{margin:0;color:var(--sub);font-size:17px}
.label{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:.06em;margin:0 0 10px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:0 0 12px}
a.card .d{font-size:14px;color:var(--accent);font-weight:700}
a.card .t{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:24px;line-height:1.4}
a.card .s{color:var(--sub);font-size:16px}
a.card .go{display:inline-block;margin-top:10px;font-size:16px;font-weight:700;color:var(--accent)}
main{padding:0 0 44px}
footer{border-top:1px solid var(--line);padding:22px 0 44px;color:var(--sub);font-size:13px}
footer p{margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="tag">원크루 자료실</div>
  <h1>정복녀 대표님</h1>
  <p>컨설팅 때마다 자료가 여기에 쌓입니다. 이 주소 하나만 저장해 두시면 됩니다.</p>
</header>

<main>
  <p class="label">전체 목록</p>
  <a class="card" href="0930/">
    <div class="d">2026년 9월 30일</div>
    <div class="t">9월 결산, 10월 준비</div>
    <div class="s">성과 체크 · 그래프 보기 · 마음 관리 · 10월 목표</div>
    <span class="go">열어 보기 →</span>
  </a>
</main>

<footer>
  <p>정복녀 대표님을 위한 자료입니다.</p>
</footer>

</div>
</body>
</html>
